name: ui_plus
description: >
  A collection of reusable Flutter UI components, application states,
  connectivity features and productivity utilities.
version: 0.6.0
homepage: https://github.com/LidhinCS/ui_plus
repository: https://github.com/LidhinCS/ui_plus
issue_tracker: https://github.com/LidhinCS/ui_plus/issues

# Shown on pub.dev search + package page (first image = thumbnail).
screenshots:
  - description: 'Pulse Tasks inbox with ScaffoldPlus, search, and paged list.'
    path: screenshots/01_tasks_inbox.png
  - description: 'Compose a task with PlusBottomSheet and async submit action.'
    path: screenshots/02_compose_task.png
  - description: 'Settings developer gates for maintenance, permission, offline.'
    path: screenshots/03_settings_gates.png
  - description: 'Inline offline connectivity banner below the app bar.'
    path: screenshots/04_offline_banner.png
  - description: 'ScaffoldPlus maintenanceMode full-page gate.'
    path: screenshots/05_maintenance_gate.png
  - description: 'ScaffoldPlus permissionDenied state with action CTA.'
    path: screenshots/06_permission_gate.png

topics:
  - flutter
  - ui
  - widgets
  - material-design
  - scaffold

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
